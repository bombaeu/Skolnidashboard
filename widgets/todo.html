<div class="todo-widget" x-data="todoWidget()">
    <h3>Úkoly</h3>
    <!-- Zde přijde zbytek HTML -->
    <div class="input-group">
        <input type="text" x-model="newTodo" @keyup.enter="add()" placeholder="Nový úkol...">
        <button @click="add()">+</button>
    </div>
    <ul>
        <template x-for="todo in todos" :key="todo.id">
            <li :class="{ 'completed': todo.completed }">
                <div class="todo-item-content">
                    <input type="checkbox" x-model="todo.completed">
                    <span x-text="todo.text"></span>
                </div>
                <button @click="remove(todo.id)" class="delete-btn">&times;</button>
            </li>
        </template>
    </ul>
    <script> function todoWidget() {
            return {
                newTodo: '',
                todos: JSON.parse(localStorage.getItem('todos') || '[]'),
                init() {
                    this.$watch('todos', (value) => {
                        localStorage.setItem('todos', JSON.stringify(value));
                    });
                },
                // ... další funkce
                add() {
                    if (this.newTodo.trim() === '') return;
                    this.todos.push({
                        id: Date.now(),
                        text: this.newTodo,
                        completed: false
                    });
                    this.newTodo = '';
                },
                remove(id) {
                    this.todos = this.todos.filter(todo => todo.id !== id);
                }

            }
        }
    </script>

    <style>
        .todo-widget {
            background: var(--widget-bg);
            color: var(--text-color);
            padding: 1rem;
            border-radius: 0.75rem;
        }

        .todo-widget h3 {
            margin-top: 0;
            margin-bottom: 1rem;
        }

        .input-group,
        .todo-widget li {
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            box-shadow: 0 4px 6px var(--shadow-color);
            justify-content: space-between;
            border-radius: 4px;
            border: 1px solid var(--shadow-hover);
            background: var(--widget-bg);
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            background: var(--widget-bg);
            border: none;
            box-shadow: none;
            padding: 0;
        }

        .input-group input {
            flex: 1;
            padding: 8px 12px;
            background: var(--body-bg);
            border: 1px solid var(--shadow-hover);
            color: var(--text-color);
            border-radius: 4px;
        }

        .todo-item-content {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .completed span {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .todo-widget button {
            cursor: pointer;
            padding: 8px 16px;
            background-color: var(--primary-color);
            color: var(--primary-color-text);
            border: none;
            border-radius: 4px;
            transition: opacity 0.2s;
        }

        .todo-widget button.delete-btn {
            padding: 4px 8px;
            background: var(--shadow-hover);
            color: var(--text-color);
            margin-left: 0.5rem;
        }

        .todo-widget button:hover {
            opacity: 0.9;
        }
    </style>
</div>
